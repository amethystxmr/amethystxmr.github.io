name: LLM check

on:
  pull_request:

permissions:
  contents: read
  models: read
  pull-requests: write

jobs:
  llm-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: llm-ci/package-lock.json

      - name: Install LLM CI dependencies
        working-directory: llm-ci
        run: npm ci

      - name: Write PR diff for LLM tools
        run: |
          set -euo pipefail
          git diff "${{ github.event.pull_request.base.sha }}"..."${{ github.event.pull_request.head.sha }}" > .llm-ci-pr.diff

      - id: review
        working-directory: llm-ci
        run: |
          set -euo pipefail
          node agent.mjs > response.txt
          {
            echo 'response<<LLM_OUT'
            cat response.txt
            echo 'LLM_OUT'
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_INFERENCE_TOKEN: ${{ secrets.LLM_MODELS_PAT }}
          LLM_MODEL: openai/gpt-4o-mini
          LLM_CI_WORKSPACE: ${{ github.workspace }}
          LLM_CI_SYSTEM: |
            You are a CI reviewer. The repository is checked out at the PR head commit on disk.

            Workspace root (absolute path): ${{ github.workspace }}
            Read files only through your filesystem MCP tools under that root.

            PR metadata:
            - pull_request_number: ${{ github.event.pull_request.number }}
            - base_repository: ${{ github.event.pull_request.base.repo.full_name }}
            - base_ref: ${{ github.event.pull_request.base.ref }}
            - base_sha: ${{ github.event.pull_request.base.sha }}
            - head_repository: ${{ github.event.pull_request.head.repo.full_name }}
            - head_ref: ${{ github.event.pull_request.head.ref }}
            - head_sha: ${{ github.event.pull_request.head.sha }}

            A unified git diff for this PR (base...head) is written at the repo-relative path `.llm-ci-pr.diff` — read it with your tools when checks refer to the PR diff.

            When you are done investigating, reply exactly as specified in the user prompt (OK or one or more FAIL lines only).

      - name: Print LLM CI output
        if: always()
        run: |
          set -euo pipefail
          echo "======== LLM CI OUTPUT (llm-ci/response.txt, verbatim) ========"
          if [ -f llm-ci/response.txt ]; then
            cat llm-ci/response.txt
          else
            echo "(file missing — review step did not produce response.txt)"
          fi
          echo "======== end LLM CI OUTPUT ========"

      - id: validate
        name: Validate LLM CI response
        run: |
          set -euo pipefail
          node llm-ci/validate_response.mjs llm-ci/response.txt

      - name: Comment on LLM CI failure
        if: ${{ failure() && steps.review.outcome == 'success' }}
        env:
          RESPONSE: ${{ steps.review.outputs.response }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = process.env.RESPONSE ?? '';
            const failLines = response
              .split(/\n/)
              .filter((line) => /^\s*FAIL:/.test(line));
            const nonEmpty = response
              .split(/\n/)
              .map((l) => l.trim())
              .filter((l) => l.length > 0);
            const strictOk = nonEmpty.length === 1 && nonEmpty[0] === 'OK';
            if (strictOk) {
              return;
            }
            const marker = '<!-- llm-ci-check -->';
            const timestamp = new Date().toISOString();
            const escaped = response
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;');
            const headline =
              failLines.length > 0
                ? '**LLM CI check**'
                : '**LLM CI check (invalid output)**';
            const body = `${marker}\n${headline} · ${timestamp}\n\n<pre>${escaped}</pre>\n`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const allComments = [];
            for (let page = 1; ; page++) {
              const { data } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
                per_page: 100,
                page,
              });
              if (!data.length) {
                break;
              }
              allComments.push(...data);
              if (data.length < 100) {
                break;
              }
            }
            const existing = allComments.find(
              (c) =>
                c.user?.login === 'github-actions[bot]' &&
                typeof c.body === 'string' &&
                c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
