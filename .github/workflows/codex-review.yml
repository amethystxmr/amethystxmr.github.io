name: Ask Codex For Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  issues: write
  pull-requests: write

jobs:
  ask-codex-for-review:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Codex review request comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- codex-review-request -->";
            const body = `${marker}\n@codex review`;
            const legacyBodies = new Set(["@codex review", "@code review"]);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const requestComments = comments.filter((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              typeof comment.body === "string" &&
              (
                comment.body.includes(marker) ||
                legacyBodies.has(comment.body.trim())
              )
            );

            requestComments.sort((a, b) => a.id - b.id);
            const existing = requestComments.at(-1);

            for (const comment of requestComments.slice(0, -1)) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comment.id,
              });
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
