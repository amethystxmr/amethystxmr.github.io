name: Codex Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  codex-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Restore cached Monero submodule
        id: monero_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: monero-wasm-src/monero
          key: llm-review-cache-monero-${{ runner.os }}

      - name: Prepare submodules via init.sh
        run: |
          set -euo pipefail
          (
            cd monero-wasm-src
            bash init.sh
          )

      - name: Save Monero submodule cache
        if: ${{ always() && steps.monero_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: monero-wasm-src/monero
          key: llm-review-cache-monero-${{ runner.os }}

      - name: Restore npm cache
        id: npm_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.npm
          key: llm-review-cache-npm-${{ runner.os }}

      - name: Setup Node with npm cache
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: |
          set -euo pipefail
          npm ci

      - name: Save npm cache
        if: ${{ always() && steps.npm_cache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.npm
          key: llm-review-cache-npm-${{ runner.os }}

      - name: Log review context
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Reviewing PR #$PR_NUMBER"
          echo "Base ref: $PR_BASE_REF"
          echo "Head ref: $PR_HEAD_REF"
          echo "Base sha: $PR_BASE_SHA"
          echo "Head sha: $PR_HEAD_SHA"
          echo "Checked out merge commit: $(git rev-parse HEAD)"
          echo "Submodules:"
          git submodule status --recursive || true

      - name: Fetch PR base and head refs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "$PR_BASE_REF" \
            "+refs/pull/$PR_NUMBER/head:refs/remotes/pull/$PR_NUMBER/head"

      - name: Log PR diff summary
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Changed files:"
          git diff --stat "$PR_BASE_SHA...$PR_HEAD_SHA"

      - name: Start Codex
        id: run_codex
        uses: openai/codex-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: read-only
          safety-strategy: drop-sudo
          codex-home: /home/runner/.codex

      - name: Run Codex review
        id: codex_exec
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -o pipefail
          codex exec \
            --skip-git-repo-check \
            --cd "$GITHUB_WORKSPACE" \
            --output-last-message codex-output.json \
            --output-schema .github/codex/output-schema.json \
            --sandbox read-only \
            < .github/codex/prompt.txt \
            2>&1 | tee codex-action.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Log Codex output file
        if: always()
        run: |
          set -euo pipefail
          if [ -f codex-output.json ]; then
            echo "codex-output.json:"
            cat codex-output.json
          else
            echo "codex-output.json was not created"
          fi

      - name: Log Codex raw output
        if: always()
        run: |
          set -euo pipefail
          if [ -f codex-action.log ]; then
            echo "codex-action.log:"
            cat codex-action.log
          else
            echo "codex-action.log was not created"
          fi

      - name: Upload Codex review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-artifacts
          if-no-files-found: ignore
          path: |
            codex-output.json
            codex-action.log

      - name: Enforce Codex review result
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require("fs");

          const outputPath = "codex-output.json";
          const rawLogPath = "codex-action.log";

          if (!fs.existsSync(outputPath)) {
            console.error("Codex review failed: codex-output.json was not created.");
            if (fs.existsSync(rawLogPath)) {
              console.error(fs.readFileSync(rawLogPath, "utf8"));
            }
            process.exit(1);
          }

          let data;
          try {
            data = JSON.parse(fs.readFileSync(outputPath, "utf8"));
          } catch (error) {
            console.error(`Codex review failed: invalid JSON in ${outputPath}: ${error.message}`);
            process.exit(1);
          }

          const { status, reason } = data ?? {};
          const validReason =
            Array.isArray(reason) && reason.every((item) => typeof item === "string");

          if (!["ok", "fail"].includes(status) || !validReason) {
            console.error(
              `Codex review failed: unexpected payload in ${outputPath}: ${JSON.stringify(data)}`
            );
            process.exit(1);
          }

          console.log(`Codex status: ${status}`);
          if (reason.length > 0) {
            console.log("Codex reason:");
            for (const item of reason) {
              console.log(item);
            }
          }

          if (status === "fail") {
            process.exit(1);
          }
          JS

  codex-review-comment:
    runs-on: ubuntu-latest
    needs: codex-review
    if: always()
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Download Codex review artifacts
        uses: actions/download-artifact@v4
        with:
          name: codex-review-artifacts
          path: .

      - name: Create or update PR comment
        uses: actions/github-script@v7
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_RESULT: ${{ needs.codex-review.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const marker = "<!-- codex-review-ci -->";
            const outputPath = "codex-output.json";
            const rawLogPath = "codex-action.log";
            const short = (value) => (value || "").slice(0, 7);

            let body;
            if (!fs.existsSync(outputPath)) {
              const rawLog = fs.existsSync(rawLogPath)
                ? fs.readFileSync(rawLogPath, "utf8").trim()
                : "";
              const tail = rawLog
                ? rawLog.split(/\r?\n/).slice(-40).join("\n")
                : `Review job result: ${process.env.REVIEW_RESULT || "unknown"}`;
              body = [
                marker,
                "**Codex review:** `FAIL`",
                "",
                "Codex did not produce `codex-output.json`, so this review run is invalid.",
                "",
                tail,
              ].join("\n");
            } else {
              let parsed;
              try {
                parsed = JSON.parse(fs.readFileSync(outputPath, "utf8"));
              } catch (error) {
                body = [
                  marker,
                  "**Codex review:** `FAIL`",
                  "",
                  "Codex output was not valid JSON.",
                  "",
                  String(error.message),
                ].join("\n");
              }

              if (!body) {
                const status = parsed && parsed.status === "ok" ? "OK" : "FAIL";
                const reasonLines = Array.isArray(parsed?.reason)
                  ? parsed.reason.filter((line) => typeof line === "string" && line.trim().length > 0)
                  : [];
                const reason = reasonLines.length > 0
                  ? reasonLines.join("\n")
                  : status === "OK"
                    ? "No issues found."
                    : "No reason provided.";
                body = [
                  marker,
                  `**Codex review:** \`${status}\``,
                  "",
                  `Diff reviewed: \`${short(process.env.PR_BASE_SHA)}...${short(process.env.PR_HEAD_SHA)}\``,
                  "",
                  reason,
                ].join("\n");
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.find((comment) =>
              comment.user?.login === "github-actions[bot]" &&
              typeof comment.body === "string" &&
              comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
