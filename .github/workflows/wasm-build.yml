name: Wasm Build

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string

jobs:
  wasm_build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Restore emscripten and build cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/emsdk
            ~/.emscripten_cache
            monero-wasm-src/built-*
          key: ${{ runner.os }}-wasm-${{ env.BUILD_TYPE }}

      - name: Setup emsdk (local) # TODO: Fix version
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest

      - name: Configure ccache
        run: |
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/monero-wasm-src/built-ccache-${BUILD_TYPE}" >> "$GITHUB_ENV"
          echo "EM_COMPILER_WRAPPER=ccache" >> "$GITHUB_ENV"
          mkdir -p "${GITHUB_WORKSPACE}/monero-wasm-src/built-ccache-${BUILD_TYPE}"
          mkdir -p "$HOME/.emscripten_cache"

      - name: Init
        working-directory: monero-wasm-src
        run: ./init.sh

      - name: Build
        working-directory: monero-wasm-src
        run: ./build.sh "$BUILD_TYPE"

      - name: Show build artifacts
        run: ls -lah monero-wasm-module

      - name: Upload monero-wasm-module artifact
        uses: actions/upload-artifact@v4
        with:
          name: monero-wasm-module-${{ env.BUILD_TYPE }}
          path: monero-wasm-module
          if-no-files-found: error

      - name: Save emscripten and build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/emsdk
            ~/.emscripten_cache
            monero-wasm-src/built-*
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}
