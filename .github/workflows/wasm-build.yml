name: Wasm Build

on:
  workflow_call:
    inputs:
      build_type:
        required: true
        type: string

jobs:
  wasm_build:
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      # Bump both when forcing cold CI caches (restore keys embed these epochs).
      WASM_CACHE_EPOCH: v16-pic-emscripten
      MONERO_SRC_CACHE_EPOCH: v4-patches-layout

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve monero submodule ref
        id: monero_ref
        run: echo "sha=$(git rev-parse HEAD:monero-wasm-src/monero)" >> "$GITHUB_OUTPUT"

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache

      - name: Restore emscripten and build cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/emsdk
            ~/.emscripten_cache
            monero-wasm-src/built-wasm-${{ env.BUILD_TYPE }}
            monero-wasm-src/built-wasm-emcache-${{ env.BUILD_TYPE }}
            monero-wasm-src/built-wasm-depends-${{ env.BUILD_TYPE }}
          key: ${{ runner.os }}-wasm-${{ env.WASM_CACHE_EPOCH }}-${{ env.BUILD_TYPE }}-${{ steps.monero_ref.outputs.sha }}-${{ hashFiles('monero-wasm-src/ContribDepends.cmake', 'monero-wasm-src/build.sh', 'monero-wasm-src/build-wasm-cmds.sh', 'monero-wasm-src/CMakeLists.txt', 'monero-wasm-src/patches/boost/*.patch', 'monero-wasm-src/patches/monero/*.patch', 'monero-wasm-src/monero/contrib/depends/packages/*.mk') }}

      - name: Setup emsdk (local)
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          # Use latest by default. We temporarily pinned 6.0.2 while investigating
          # the PIC linker failure that is fixed by the CMake -fPIC flag.
          "$HOME/emsdk/emsdk" install latest
          "$HOME/emsdk/emsdk" activate latest

      - name: Configure ccache
        run: |
          CCACHE_DIR="${GITHUB_WORKSPACE}/monero-wasm-src/built-ccache-${BUILD_TYPE}"
          echo "CCACHE_DIR=${CCACHE_DIR}" >> "$GITHUB_ENV"
          echo "EM_COMPILER_WRAPPER=ccache" >> "$GITHUB_ENV"
          mkdir -p "${CCACHE_DIR}"
          mkdir -p "$HOME/.emscripten_cache"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: monero-wasm-src/built-ccache-${{ env.BUILD_TYPE }}
          key: ${{ runner.os }}-ccache-${{ env.WASM_CACHE_EPOCH }}-${{ env.BUILD_TYPE }}-${{ steps.monero_ref.outputs.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.WASM_CACHE_EPOCH }}-${{ env.BUILD_TYPE }}-${{ steps.monero_ref.outputs.sha }}-
            ${{ runner.os }}-ccache-${{ env.WASM_CACHE_EPOCH }}-${{ env.BUILD_TYPE }}-

      - name: Enforce ccache config after restore
        run: |
          ccache --set-config cache_dir="${CCACHE_DIR}"
          ccache --set-config max_size=2G

      - name: Restore monero source cache
        id: monero_cache_restore
        uses: actions/cache/restore@v4
        with:
          path: |
            monero-wasm-src/monero
            .git/modules/monero-wasm-src/monero
          key: ${{ runner.os }}-monero-src-${{ env.MONERO_SRC_CACHE_EPOCH }}-${{ steps.monero_ref.outputs.sha }}-${{ hashFiles('monero-wasm-src/init.sh', 'monero-wasm-src/patches/monero/*.patch') }}

      - name: Init
        if: steps.monero_cache_restore.outputs.cache-hit != 'true'
        working-directory: monero-wasm-src
        run: ./init.sh

      - name: Save monero source cache
        if: steps.monero_cache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            monero-wasm-src/monero
            .git/modules/monero-wasm-src/monero
          key: ${{ steps.monero_cache_restore.outputs.cache-primary-key }}

      - name: ccache stats (before build)
        run: |
          ccache --show-stats --verbose
          ccache -z

      - name: Build
        working-directory: monero-wasm-src
        run: ./build.sh "$BUILD_TYPE"

      - name: ccache stats (after build)
        if: always()
        run: ccache --show-stats --verbose

      - name: Show build artifacts
        run: ls -lah monero-wasm-module

      - name: Upload monero-wasm-module artifact
        uses: actions/upload-artifact@v4
        with:
          name: monero-wasm-module-${{ env.BUILD_TYPE }}
          path: monero-wasm-module
          if-no-files-found: error

      - name: Save emscripten and build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/emsdk
            ~/.emscripten_cache
            monero-wasm-src/built-wasm-${{ env.BUILD_TYPE }}
            monero-wasm-src/built-wasm-emcache-${{ env.BUILD_TYPE }}
            monero-wasm-src/built-wasm-depends-${{ env.BUILD_TYPE }}
          key: ${{ steps.restore-cache.outputs.cache-primary-key }}

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: monero-wasm-src/built-ccache-${{ env.BUILD_TYPE }}
          key: ${{ runner.os }}-ccache-${{ env.WASM_CACHE_EPOCH }}-${{ env.BUILD_TYPE }}-${{ steps.monero_ref.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
