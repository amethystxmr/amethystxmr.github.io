name: Update Emscripten Version

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-emscripten-version
  cancel-in-progress: false

jobs:
  update_emscripten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Emscripten version
        id: update
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW_PATH=".github/workflows/wasm-build.yml"
          RELEASE_TAGS_URL="https://raw.githubusercontent.com/emscripten-core/emsdk/main/emscripten-releases-tags.json"

          current_version="$(
            python3 - <<'PY'
          import pathlib
          import re
          import sys

          text = pathlib.Path(".github/workflows/wasm-build.yml").read_text()
          match = re.search(r"^\s*EMSCRIPTEN_VERSION:\s*([^\s#]+)", text, re.MULTILINE)
          if not match:
              print("Failed to find EMSCRIPTEN_VERSION in wasm-build.yml", file=sys.stderr)
              sys.exit(1)
          print(match.group(1))
          PY
          )"

          latest_version="$(
            curl -fsSL "${RELEASE_TAGS_URL}" \
            | jq -r '.aliases.latest // empty'
          )"
          if [ -z "${latest_version}" ]; then
            echo "Failed to resolve latest Emscripten version from ${RELEASE_TAGS_URL}" >&2
            exit 1
          fi

          is_newer="$(
            python3 - "${current_version}" "${latest_version}" <<'PY'
          import sys

          current, latest = sys.argv[1], sys.argv[2]

          def parse_version(value):
              return tuple(int(part) for part in value.split("."))

          print("true" if parse_version(latest) > parse_version(current) else "false")
          PY
          )"

          echo "current_version=${current_version}" >> "${GITHUB_OUTPUT}"
          echo "latest_version=${latest_version}" >> "${GITHUB_OUTPUT}"

          if [ "${is_newer}" != "true" ]; then
            echo "Emscripten is already up to date (${current_version}); latest is ${latest_version}."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          python3 - "${WORKFLOW_PATH}" "${latest_version}" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          latest = sys.argv[2]
          text = path.read_text()
          updated = re.sub(
              r"^(\s*EMSCRIPTEN_VERSION:\s*)[^\s#]+",
              rf"\g<1>{latest}",
              text,
              count=1,
              flags=re.MULTILINE,
          )
          if updated == text:
              print(f"Failed to update EMSCRIPTEN_VERSION in {path}", file=sys.stderr)
              sys.exit(1)
          path.write_text(updated)
          PY

          git add "${WORKFLOW_PATH}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: chore/update-emscripten-version
          delete-branch: false
          draft: true
          commit-message: "chore(emscripten): update to ${{ steps.update.outputs.latest_version }}"
          title: "chore(emscripten): update to ${{ steps.update.outputs.latest_version }}"
          body: |
            Automated update of the Emscripten version used by the WASM build.

            - Previous version: `${{ steps.update.outputs.current_version }}`
            - New version: `${{ steps.update.outputs.latest_version }}`

            This PR is generated by the scheduled `Update Emscripten Version` workflow.
