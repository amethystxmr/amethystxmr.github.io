name: Update Vulnerable npm Packages

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-npm-vulnerabilities
  cancel-in-progress: false

jobs:
  update_npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply non-breaking npm audit fixes
        id: update
        shell: bash
        run: |
          set -euo pipefail

          UPDATE_BRANCH="chore/update-npm-vulnerabilities"

          npm ci

          summarize_audit() {
            # npm audit exits non-zero when vulnerabilities remain; keep parsing JSON.
            local audit_json
            audit_json="$(npm audit --json 2>/dev/null || true)"

            if ! jq -e 'type == "object" and (.error? | not) and (.metadata.vulnerabilities | type == "object")' >/dev/null <<< "${audit_json}"; then
              echo "npm audit did not return vulnerability metadata." >&2
              jq -r '.error.summary? // .error.detail? // empty' <<< "${audit_json}" >&2 || true
              return 1
            fi

            jq -r '
              (.metadata.vulnerabilities // {}) as $v
              | "total=\(($v.total // 0)) info=\(($v.info // 0)) low=\(($v.low // 0)) moderate=\(($v.moderate // 0)) high=\(($v.high // 0)) critical=\(($v.critical // 0))"
            ' <<< "${audit_json}"
          }

          before_summary="$(summarize_audit)"
          echo "before_summary=${before_summary}" >> "${GITHUB_OUTPUT}"

          # Prefer non-breaking fixes only. Major upgrades stay manual.
          npm audit fix || true

          after_summary="$(summarize_audit)"
          echo "after_summary=${after_summary}" >> "${GITHUB_OUTPUT}"

          if git diff --quiet -- package.json package-lock.json; then
            echo "No package.json / package-lock.json changes from npm audit fix."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          new_lock_hash="$(sha256sum package-lock.json | awk '{print $1}')"
          echo "new_lock_hash=${new_lock_hash}" >> "${GITHUB_OUTPUT}"

          github_token="${{ secrets.GITHUB_TOKEN }}"

          # If an update PR is already open from the same branch and already
          # has this exact lockfile, do nothing.
          existing_pr_number="$(
            curl -fsSL \
              -H "Authorization: Bearer ${github_token}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${UPDATE_BRANCH}" \
            | jq -r '.[0].number // empty'
          )"

          existing_lock_hash=""
          if git fetch --no-tags origin "${UPDATE_BRANCH}:refs/remotes/origin/${UPDATE_BRANCH}" >/dev/null 2>&1; then
            existing_lock_hash="$(git show "origin/${UPDATE_BRANCH}:package-lock.json" | sha256sum | awk '{print $1}')"
          fi

          if [ -n "${existing_pr_number}" ] && [ -n "${existing_lock_hash}" ] && [ "${existing_lock_hash}" = "${new_lock_hash}" ]; then
            echo "Open PR #${existing_pr_number} already has lockfile ${new_lock_hash}; skipping."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git add package.json package-lock.json
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          base: ${{ github.event.repository.default_branch }}
          branch: chore/update-npm-vulnerabilities
          delete-branch: false
          commit-message: "chore(deps): apply npm audit fixes"
          title: "chore(deps): apply npm audit fixes"
          body: |
            Automated npm audit dependency update.

            - Before: `${{ steps.update.outputs.before_summary }}`
            - After: `${{ steps.update.outputs.after_summary }}`
            - Lockfile SHA-256: `${{ steps.update.outputs.new_lock_hash }}`

            This PR is generated by the scheduled `Update Vulnerable npm Packages` workflow.
            It only applies non-breaking `npm audit fix` changes; major upgrades remain manual.
