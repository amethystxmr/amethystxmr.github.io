name: Update Monero Submodule

on:
  # TEMP for testing before merging to master.
  # Revert after validation.
  pull_request:
    paths:
      - ".github/workflows/update-monero.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-monero-submodule
  cancel-in-progress: false

jobs:
  update_monero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update submodule to latest Monero release
        id: update
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          SUBMODULE_PATH="monero-wasm-src/monero"
          REPO="monero-project/monero"
          UPDATE_BRANCH="chore/update-monero-submodule"

          current_sha="$(git ls-tree HEAD "${SUBMODULE_PATH}" | awk '{print $3}')"
          if [ -z "${current_sha}" ]; then
            echo "Failed to read current submodule sha for ${SUBMODULE_PATH}" >&2
            exit 1
          fi

          git submodule sync -- "${SUBMODULE_PATH}"
          git submodule update --init --depth 1 -- "${SUBMODULE_PATH}"

          release_ref="$(curl -fsSL "https://api.github.com/repos/${REPO}/releases/latest" | jq -r '.tag_name')"
          if [ -z "${release_ref}" ] || [ "${release_ref}" = "null" ]; then
            echo "Failed to resolve latest release reference for ${REPO}" >&2
            exit 1
          fi

          # Only fetch tags/commits for the Monero submodule itself.
          # Recursive fetching can fail on nested submodule refs that are not needed here.
          git -C "${SUBMODULE_PATH}" fetch --tags --no-recurse-submodules origin

          target_sha="$(git -C "${SUBMODULE_PATH}" rev-list -n 1 "${release_ref}")"
          if [ -z "${target_sha}" ]; then
            echo "Failed to resolve target sha for reference ${release_ref}" >&2
            exit 1
          fi

          echo "current_sha=${current_sha}" >> "${GITHUB_OUTPUT}"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"
          echo "target_sha_short=${target_sha:0:12}" >> "${GITHUB_OUTPUT}"

          # If an update PR is already open from the same branch and already
          # points to this exact Monero commit, do nothing.
          existing_pr_number="$(
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${UPDATE_BRANCH}" \
            | jq -r '.[0].number // empty'
          )"

          existing_branch_sha=""
          if git fetch --no-tags origin "${UPDATE_BRANCH}:refs/remotes/origin/${UPDATE_BRANCH}" >/dev/null 2>&1; then
            existing_branch_sha="$(git ls-tree "origin/${UPDATE_BRANCH}" "${SUBMODULE_PATH}" | awk '{print $3}')"
          fi

          if [ -n "${existing_pr_number}" ] && [ -n "${existing_branch_sha}" ] && [ "${existing_branch_sha}" = "${target_sha}" ]; then
            echo "Open PR #${existing_pr_number} already targets ${target_sha}; skipping."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${current_sha}" = "${target_sha}" ]; then
            echo "Submodule already at target commit ${target_sha}"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git -C "${SUBMODULE_PATH}" checkout --detach "${target_sha}"
          git add "${SUBMODULE_PATH}"

          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/update-monero-submodule
          delete-branch: false
          commit-message: |
            chore(monero): update submodule to ${{ steps.update.outputs.target_sha_short }}
          title: |
            chore(monero): update to ${{ steps.update.outputs.target_sha_short }}
          body: |
            Automated update of `monero-wasm-src/monero` submodule.

            - Previous SHA: `${{ steps.update.outputs.current_sha }}`
            - New SHA: `${{ steps.update.outputs.target_sha }}`

            This PR is generated by the scheduled `Update Monero Submodule` workflow.
