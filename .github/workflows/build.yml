name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

jobs:
  resolve_build_type:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.resolve.outputs.build_type }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build_type=Debug" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=Release" >> "$GITHUB_OUTPUT"
          fi

  wasm_build:
    needs: resolve_build_type
    uses: ./.github/workflows/wasm-build.yml
    with:
      build_type: ${{ needs.resolve_build_type.outputs.build_type }}

  web_frontend:
    needs:
      - resolve_build_type
      - wasm_build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/web-frontend.yml
    with:
      build_type: ${{ needs.resolve_build_type.outputs.build_type }}

  e2e_tests:
    needs:
      - resolve_build_type
      - wasm_build
    uses: ./.github/workflows/e2e.yml
    with:
      build_type: ${{ needs.resolve_build_type.outputs.build_type }}

  native_apps:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build native apps'))
    needs:
      - resolve_build_type
      - web_frontend
    uses: ./.github/workflows/native-apps.yml
    with:
      build_type: ${{ needs.resolve_build_type.outputs.build_type }}

  release_native_apps:
    needs:
      - native_apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: native-*-Release
          merge-multiple: true

      - name: Build commit release tag
        id: release_tag
        run: echo "value=master-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: Master Native Build (${{ github.sha }})
          tag: ${{ steps.release_tag.outputs.value }}
          commit: ${{ github.sha }}
          generateReleaseNotes: true
          artifactErrorsFailBuild: true
          makeLatest: true
          immutableCreate: true
          skipIfReleaseExists: true
          artifacts: release-assets/*

  wait_for_pages_deploy:
    needs:
      - web_frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for deployed githash.txt
        env:
          TARGET_HASH: ${{ github.sha }}
          GITHUB_PAGES_HASH_URL: https://${{ github.event.repository.name }}/githash.txt
        run: |
          echo "Waiting for $GITHUB_PAGES_HASH_URL to become $TARGET_HASH"

          ATTEMPTS=60
          SLEEP_SECONDS=10

          for i in $(seq 1 "$ATTEMPTS"); do
            CURRENT_HASH="$(curl -fsSL "$GITHUB_PAGES_HASH_URL" | tr -d '\r\n' || true)"
            if [ "$CURRENT_HASH" = "$TARGET_HASH" ]; then
              echo "GitHub Pages updated to target hash: $CURRENT_HASH"
              exit 0
            fi

            echo "Attempt $i/$ATTEMPTS: got '$CURRENT_HASH', waiting..."
            sleep "$SLEEP_SECONDS"
          done

          echo "Timed out waiting for GitHub Pages hash to match target hash ($TARGET_HASH)."
          exit 1
