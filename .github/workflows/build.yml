name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  resolve_build_type:
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.resolve.outputs.build_type }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "build_type=Debug" >> "$GITHUB_OUTPUT"
          else
            echo "build_type=Release" >> "$GITHUB_OUTPUT"
          fi

  wasm_build:
    needs: resolve_build_type
    uses: ./.github/workflows/wasm-build.yml
    with:
      build_type: ${{ needs.resolve_build_type.outputs.build_type }}

  web_frontend:
    needs:
      - resolve_build_type
      - wasm_build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/web-frontend.yml
    with:
      build_type: ${{ needs.resolve_build_type.outputs.build_type }}
