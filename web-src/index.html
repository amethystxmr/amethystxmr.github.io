<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Amethyst XMR</title>
    <link href="./index.css" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
      }

      #root {
        min-height: 100dvh;
      }

      .boot-loader {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .boot-loader__card {
        width: min(420px, 100%);
        border-radius: 16px;
        padding: 18px 20px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow:
          0 14px 34px rgba(0, 0, 0, 0.45),
          inset 0 0 12px rgba(255, 255, 255, 0.07);
      }

      .boot-loader__row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .boot-loader__spinner {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        border: 2px solid rgba(255, 255, 255, 0.28);
        border-top-color: #fff;
        animation: boot-spin 0.75s linear infinite;
      }

      .boot-loader__text {
        margin: 0;
        color: rgba(255, 255, 255, 0.9);
        font:
          600 0.95rem/1.3 "Inter Variable",
          Inter,
          sans-serif;
      }

      .boot-loader__hint {
        margin: 8px 0 0;
        color: rgba(255, 255, 255, 0.62);
        font:
          400 0.82rem/1.25 "Inter Variable",
          Inter,
          sans-serif;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(1turn);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        class="boot-loader"
        role="status"
        aria-live="polite"
        aria-label="Loading wallet module"
      >
        <div class="boot-loader__card">
          <div class="boot-loader__row">
            <div class="boot-loader__spinner" aria-hidden="true"></div>
            <p class="boot-loader__text">Loading wallet...</p>
          </div>
          <p class="boot-loader__hint">This might take few seconds.</p>
        </div>
      </div>
    </div>

    <script type="module" src="./index.tsx"></script>
  </body>
</html>
